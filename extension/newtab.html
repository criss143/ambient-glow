<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nueva pestaña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;600;800&display=swap">
<link rel="stylesheet" href="newtab.css">
</head>
<body>
  <!-- fondo -->
  <div class="aurora" aria-hidden="true">
    <i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i>
  </div>
  <canvas id="sync" width="16" height="9" aria-hidden="true"></canvas>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- barra superior -->
  <header class="top">
    <div class="brand"><span class="dot"></span>Ambient Glow</div>
    <div id="nowPlaying" class="now" hidden>
      <span class="eq"><i></i><i></i><i></i><i></i></span>
      <span class="np-label">Sonando</span>
      <span id="npTitle" class="np-title"></span>
    </div>
    <button id="editBtn" class="icon-btn" title="Editar accesos">
      <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M14 6l4 4"/></svg>
    </button>
  </header>

  <main>
    <p id="greet" class="greet"></p>

    <div class="clock-wrap">
      <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#a78bfa"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/>
          </linearGradient>
        </defs>
        <circle cx="60" cy="60" r="56" class="track"/>
        <circle id="secRing" cx="60" cy="60" r="56" class="prog"/>
      </svg>
      <div class="clock">
        <span id="hh">--</span><span class="colon">:</span><span id="mm">--</span>
        <span id="ampm" class="ampm"></span>
      </div>
    </div>
    <p id="date" class="date"></p>

    <form id="search" autocomplete="off">
      <div class="engines" role="tablist">
        <button type="button" data-engine="google" class="on" title="Google">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.5 12.3c0-.8-.1-1.5-.2-2.3H12v4.3h5.9a5 5 0 0 1-2.2 3.3v2.7h3.6c2.1-1.9 3.2-4.8 3.2-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.7c-1 .7-2.2 1-3.7 1-2.8 0-5.2-1.9-6.1-4.5H2.2v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.9 14.1a6.6 6.6 0 0 1 0-4.2V7.1H2.2a11 11 0 0 0 0 9.8l3.7-2.8z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3 .6 4.1 1.6l3.1-3.1A11 11 0 0 0 2.2 7.1l3.7 2.8C6.8 7.3 9.2 5.4 12 5.4z"/></svg>
        </button>
        <button type="button" data-engine="youtube" title="YouTube">
          <svg viewBox="0 0 24 24"><path fill="#FF0033" d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12 31 31 0 0 0 1 16.8a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1c.4-1.6.5-4.8.5-4.8s0-3.2-.5-4.8z"/><path fill="#fff" d="M9.7 15.1V8.9L15.5 12z"/></svg>
        </button>
      </div>
      <input id="q" name="q" placeholder="Buscar en Google o escribir una URL" autofocus spellcheck="false">
      <kbd>/</kbd>
      <button type="submit" class="go" aria-label="Buscar">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>

    <nav id="links" class="links"></nav>

    <form id="addForm" class="add-form" hidden>
      <input id="addName" placeholder="Nombre" maxlength="18">
      <input id="addUrl" placeholder="https://..." >
      <button type="submit">Añadir</button>
    </form>
  </main>

  <footer>Dev <b>@Itzcrissxit</b></footer>

  <script src="defaults.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
